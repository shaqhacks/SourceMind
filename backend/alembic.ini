[alembic]
# Path to migration scripts, relative to this ini file.
script_location = %(here)s/db/migrations

# No sqlalchemy.url here on purpose: env.py resolves the URL at runtime from
# SOURCEMIND_DB_URL (see backend/config.py), and backend/db/base.py always
# passes the URL explicitly when driving Alembic from the Python API. This
# key exists only so `alembic` CLI invocations from backend/ have a sane
# fallback default for local development.
# sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
