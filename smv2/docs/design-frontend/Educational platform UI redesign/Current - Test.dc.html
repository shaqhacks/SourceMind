<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; background: #fdfcfb; color: #1a1a1a; font-family: 'Geist', ui-sans-serif, system-ui, sans-serif; }
    a { color: #2563eb; text-decoration: none; }
    a:hover { color: #1d4ed8; }
  </style>
</helmet>
<div style="display: flex; min-height: 100vh; flex-direction: column;">
  <header style="display: flex; align-items: center; justify-content: space-between; gap: 16px; border-bottom: 1px solid #7d7d78; padding: 16px 24px;">
    <h1 style="margin: 0; font-size: 18px; font-weight: 600;"><a href="#" style="color: #1a1a1a;">SourceMind</a></h1>
    <div style="display: flex; align-items: center; gap: 12px;">
      <a href="#" style="border-radius: 9999px; background: #2563eb; padding: 4px 10px; font-size: 12px; font-weight: 500; color: #ffffff;">12 due</a>
      <div role="group" style="display: inline-flex; overflow: hidden; border-radius: 6px; border: 1px solid #7d7d78; font-size: 14px;">
        <button style="padding: 6px 12px; background: #2563eb; color: #ffffff; border: none; font-family: inherit; font-size: 14px; cursor: pointer;">System</button>
        <button style="padding: 6px 12px; background: transparent; color: #1a1a1a; border: none; font-family: inherit; font-size: 14px; cursor: pointer;">Light</button>
        <button style="padding: 6px 12px; background: transparent; color: #1a1a1a; border: none; font-family: inherit; font-size: 14px; cursor: pointer;">Dark</button>
      </div>
    </div>
  </header>
  <div style="border-bottom: 1px solid #7d7d78; padding: 16px 32px;">
    <h1 style="margin: 0; font-size: 18px; font-weight: 600;">Quiz</h1>
  </div>
  <div style="margin: 0 auto; display: flex; width: 100%; max-width: 672px; flex-direction: column; gap: 24px; padding: 32px; box-sizing: border-box;">
    <div style="display: flex; flex-direction: column; gap: 8px;">
      <p role="status" style="margin: 0; font-size: 14px; color: #52525b;">Question 2 of 5</p>
      <div style="height: 6px; width: 100%; overflow: hidden; border-radius: 9999px; background: rgba(82,82,91,0.15);">
        <div style="height: 100%; width: 40%; border-radius: 9999px; background: #2563eb;"></div>
      </div>
    </div>
    <h2 style="margin: 0; font-size: 16px; font-weight: 600;">When your PDF has no embedded bookmarks, how does SourceMind build the outline?</h2>
    <fieldset style="display: flex; flex-direction: column; gap: 8px; border: none; margin: 0; padding: 0;">
      <label style="display: flex; align-items: flex-start; gap: 12px; border-radius: 8px; border: 1px solid #7d7d78; background: #f5f3ef; padding: 12px; font-size: 16px; cursor: pointer;" style-hover="border-color: #52525b;">
        <input type="radio" name="q2" style="margin-top: 2px;">
        It asks an AI model to read the document and propose chapters
      </label>
      <label style="display: flex; align-items: flex-start; gap: 12px; border-radius: 8px; border: 1px solid #2563eb; background: rgba(219,234,254,0.4); padding: 12px; font-size: 16px; cursor: pointer;">
        <input type="radio" name="q2" defaultChecked="{{ true }}" style="margin-top: 2px;">
        It falls back to even page windows — a fixed number of pages per chapter
      </label>
      <label style="display: flex; align-items: flex-start; gap: 12px; border-radius: 8px; border: 1px solid #7d7d78; background: #f5f3ef; padding: 12px; font-size: 16px; cursor: pointer;" style-hover="border-color: #52525b;">
        <input type="radio" name="q2" style="margin-top: 2px;">
        It refuses to ingest the file until bookmarks are added
      </label>
      <label style="display: flex; align-items: flex-start; gap: 12px; border-radius: 8px; border: 1px solid #7d7d78; background: #f5f3ef; padding: 12px; font-size: 16px; cursor: pointer;" style-hover="border-color: #52525b;">
        <input type="radio" name="q2" style="margin-top: 2px;">
        It puts the entire document into one chapter
      </label>
    </fieldset>
    <button style="align-self: flex-start; border-radius: 6px; background: #1a1a1a; color: #fdfcfb; border: none; padding: 8px 16px; font-size: 14px; font-weight: 500; font-family: inherit; cursor: pointer;" style-hover="opacity: 0.9;">Next (Enter)</button>
  </div>
</div>
</x-dc>
</body>
</html>
