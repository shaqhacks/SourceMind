<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; background: #fdfcfb; color: #1a1a1a; font-family: 'Geist', ui-sans-serif, system-ui, sans-serif; }
    a { color: #2563eb; text-decoration: none; }
    a:hover { color: #1d4ed8; }
  </style>
</helmet>
<div style="position: relative; min-height: 100vh;">
  <header style="display: flex; align-items: center; justify-content: space-between; gap: 16px; border-bottom: 1px solid #7d7d78; padding: 16px 24px;">
    <h1 style="margin: 0; font-size: 18px; font-weight: 600;"><a href="#" style="color: #1a1a1a;">SourceMind</a></h1>
    <div style="display: flex; align-items: center; gap: 12px;">
      <a href="#" style="border-radius: 9999px; background: #2563eb; padding: 4px 10px; font-size: 12px; font-weight: 500; color: #ffffff;">12 due</a>
    </div>
  </header>
  <main style="margin: 0 auto; max-width: 1024px; padding: 32px 24px;">
    <h1 style="margin: 0; font-size: 24px; font-weight: 600; letter-spacing: -0.025em;">Your courses</h1>
  </main>
  <div style="position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.4); padding: 16px;">
    <div role="dialog" aria-label="Upload course" style="max-height: 90vh; width: 100%; max-width: 512px; overflow-y: auto; border-radius: 8px; border: 1px solid #7d7d78; background: #f5f3ef; padding: 24px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1), 0 8px 10px -6px rgba(0,0,0,0.1); box-sizing: border-box;">
      <div style="margin-bottom: 16px; display: flex; align-items: center; justify-content: space-between;">
        <h2 style="margin: 0; font-size: 16px; font-weight: 600;">Add a course</h2>
        <button style="border-radius: 6px; border: 1px solid #7d7d78; background: transparent; padding: 4px 8px; font-size: 12px; font-weight: 500; font-family: inherit; cursor: pointer; color: #1a1a1a;" style-hover="background: rgba(82,82,91,0.1);">Close</button>
      </div>
      <ol aria-label="Upload progress" style="margin: 0 0 16px; padding: 0; list-style: none; display: flex; align-items: center; gap: 8px; font-size: 12px;">
        <li style="display: flex; align-items: center; gap: 8px;">
          <span aria-current="step" style="display: flex; height: 20px; width: 20px; align-items: center; justify-content: center; border-radius: 9999px; font-size: 10px; font-weight: 600; background: #2563eb; color: #ffffff;">1</span>
          <span style="font-weight: 500;">Name</span>
          <span style="color: #52525b;">—</span>
        </li>
        <li style="display: flex; align-items: center; gap: 8px;">
          <span style="display: flex; height: 20px; width: 20px; align-items: center; justify-content: center; border-radius: 9999px; font-size: 10px; font-weight: 600; background: rgba(82,82,91,0.15); color: #52525b;">2</span>
          <span style="color: #52525b;">Upload</span>
          <span style="color: #52525b;">—</span>
        </li>
        <li style="display: flex; align-items: center; gap: 8px;">
          <span style="display: flex; height: 20px; width: 20px; align-items: center; justify-content: center; border-radius: 9999px; font-size: 10px; font-weight: 600; background: rgba(82,82,91,0.15); color: #52525b;">3</span>
          <span style="color: #52525b;">Ingest</span>
        </li>
      </ol>
      <div style="display: flex; flex-direction: column; gap: 16px;">
        <label style="display: flex; flex-direction: column; gap: 4px; font-size: 14px;">
          <span style="color: #52525b;">Course title</span>
          <input type="text" value="Statistics 101" style="border-radius: 6px; border: 1px solid #7d7d78; padding: 8px 12px; font-family: inherit; font-size: 14px; color: #1a1a1a; background: #fdfcfb;">
        </label>
        <ul style="margin: 0; padding: 0; list-style: none; font-size: 14px; color: #52525b;">
          <li style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">statistics-101-textbook.pdf</li>
        </ul>
        <button style="align-self: flex-end; border-radius: 6px; background: #1a1a1a; color: #fdfcfb; border: none; padding: 8px 16px; font-size: 14px; font-weight: 500; font-family: inherit; cursor: pointer;" style-hover="opacity: 0.9;">Create &amp; upload</button>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
