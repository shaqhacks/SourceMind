<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="ds/organic.css">
  <link rel="stylesheet" href="ds/theme.css">
  <style>
    body { margin: 0; }
  </style>
</helmet>
<div style="height: 100vh; display: flex; flex-direction: column; overflow: hidden;">
  <header style="display: flex; align-items: center; gap: 16px; padding: 12px 20px; border-bottom: 1px solid var(--color-divider); flex: none;">
    <a class="btn btn-secondary btn-icon" aria-label="Back to tests" href="Redesign – Tests.dc.html" style="text-decoration: none;">←</a>
    <span class="nav-brand" style="font-size: 20px; color: var(--color-accent);">SourceMind</span>
    <span class="text-muted" style="font-size: 14px;">Chapter 1 test · attempt 3</span>
    <div style="margin-left: auto; display: flex; align-items: center; gap: 12px;">
      <button class="btn btn-secondary btn-icon" aria-label="Toggle dark mode" onClick="{{ toggleTheme }}">{{ themeIcon }}</button>
      <a class="btn btn-secondary" href="Redesign – Tests.dc.html" style="font-size: 13px; padding: 6px 14px; text-decoration: none;">Save &amp; exit</a>
    </div>
  </header>
  <main style="width: 100%; max-width: 760px; margin: 0 auto; padding: 40px 36px; box-sizing: border-box; display: flex; flex-direction: column; gap: 24px; flex: 1; overflow-y: auto;">
    <div style="display: flex; align-items: center; gap: 14px;">
      <div style="flex: 1; height: 8px; border-radius: 999px; background: var(--color-neutral-200);"><div style="height: 100%; width: 40%; border-radius: 999px; background: var(--color-accent);"></div></div>
      <span class="text-muted" style="font-size: 13px; font-weight: 600; flex: none;">Question 2 of 5</span>
    </div>
    <div class="card elev-md" style="padding: 32px 36px; gap: 20px;">
      <span class="card-kicker">Outline detection</span>
      <h2 style="margin: 0; font-size: 22px; line-height: 1.35; font-family: var(--font-heading);">When your PDF has no embedded bookmarks, how does SourceMind build the outline?</h2>
      <div style="display: flex; flex-direction: column; gap: 10px;">
        <label style="display: flex; align-items: flex-start; gap: 12px; border: 1px solid var(--color-divider); border-radius: 10px; background: var(--color-bg); padding: 14px 16px; font-size: 15px; cursor: pointer; line-height: 1.4;">
          <input type="radio" name="q2" style="margin-top: 3px; accent-color: var(--color-accent);">
          <span><strong style="color: var(--color-neutral-600); font-weight: 600; margin-right: 6px;">1</strong> It asks an AI model to read the document and propose chapters</span>
        </label>
        <label style="display: flex; align-items: flex-start; gap: 12px; border: 1.5px solid var(--color-accent); border-radius: 10px; background: var(--color-accent-100); padding: 14px 16px; font-size: 15px; cursor: pointer; line-height: 1.4;">
          <input type="radio" name="q2" defaultChecked="{{ true }}" style="margin-top: 3px; accent-color: var(--color-accent);">
          <span><strong style="color: var(--color-accent-700); font-weight: 600; margin-right: 6px;">2</strong> It falls back to even page windows — a fixed number of pages per chapter</span>
        </label>
        <label style="display: flex; align-items: flex-start; gap: 12px; border: 1px solid var(--color-divider); border-radius: 10px; background: var(--color-bg); padding: 14px 16px; font-size: 15px; cursor: pointer; line-height: 1.4;">
          <input type="radio" name="q2" style="margin-top: 3px; accent-color: var(--color-accent);">
          <span><strong style="color: var(--color-neutral-600); font-weight: 600; margin-right: 6px;">3</strong> It refuses to ingest the file until bookmarks are added</span>
        </label>
        <label style="display: flex; align-items: flex-start; gap: 12px; border: 1px solid var(--color-divider); border-radius: 10px; background: var(--color-bg); padding: 14px 16px; font-size: 15px; cursor: pointer; line-height: 1.4;">
          <input type="radio" name="q2" style="margin-top: 3px; accent-color: var(--color-accent);">
          <span><strong style="color: var(--color-neutral-600); font-weight: 600; margin-right: 6px;">4</strong> It puts the entire document into one chapter</span>
        </label>
      </div>
      <div style="display: flex; align-items: center; justify-content: space-between;">
        <button class="btn btn-ghost" style="font-size: 14px;">← Previous</button>
        <button class="btn btn-primary">Next question</button>
      </div>
    </div>
    <p class="text-muted" style="margin: 0; text-align: center; font-size: 13px;"><kbd style="border: 1px solid var(--color-divider); border-radius: 6px; padding: 1px 7px; font-family: inherit;">1–4</kbd> pick an answer · <kbd style="border: 1px solid var(--color-divider); border-radius: 6px; padding: 1px 7px; font-family: inherit;">Enter</kbd> next / submit</p>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280}}">
class Component extends DCLogic {
  state = { theme: "light" };
  componentDidMount() {
    let theme = "light";
    try { theme = localStorage.getItem("sm.theme") || "light"; } catch (e) {}
    this.setState({ theme });
    document.documentElement.setAttribute("data-theme", theme);
  }
  renderVals() {
    return {
      themeIcon: this.state.theme === "dark" ? "☀" : "☾",
      toggleTheme: () => this.setState((s) => {
        const theme = s.theme === "dark" ? "light" : "dark";
        try { localStorage.setItem("sm.theme", theme); } catch (e) {}
        document.documentElement.setAttribute("data-theme", theme);
        return { theme };
      }),
    };
  }
}
</script>
</body>
</html>
